name: CMake Build and Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-native:
    name: Build & Test (Native)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential valgrind cppcheck

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_DRNG=ON -DENABLE_PQC=ON -DBUILD_TESTS=ON -DBUILD_APP=ON
        env:
          CC: ${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run CTest (including KATs)
        run: cd build && ctest --output-on-failure

  binary-check:
    name: No Binary Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check for committed binaries
        run: |
          # Fail if any binary artifacts are found
          found=0
          for pattern in "*.exe" "*.out" "*.so" "*.a" "*.o" "app/app" "tests/test_all"; do
            files=$(find . -name "$pattern" -not -path "./.git/*" -not -path "./build/*" 2>/dev/null)
            if [ -n "$files" ]; then
              echo "FOUND binary: $files"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "ERROR: Binary artifacts found in repository!"
            exit 1
          fi
          echo "No binary artifacts found - PASS"

  build-native-valgrind:
    name: Valgrind Memory Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential valgrind

      - name: Configure (Debug for Valgrind)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_DRNG=ON -DENABLE_PQC=ON -DBUILD_TESTS=ON -DBUILD_APP=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Valgrind Memory Check
        run: |
          valgrind --tool=memcheck --leak-check=full --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite --error-exitcode=1 \
            build/tests/test_original

  build-cross-arm64:
    name: Cross-Compile (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu

      - name: Configure (ARM64)
        run: |
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm64.cmake \
            -DENABLE_DRNG=OFF -DENABLE_PQC=ON -DBUILD_TESTS=OFF -DBUILD_APP=OFF

      - name: Build
        run: cmake --build build-arm64 --parallel 4

  build-cross-x86-32:
    name: Cross-Compile (x86 32-bit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-multilib g++-multilib

      - name: Configure (x86 32)
        run: |
          cmake -B build-x86-32 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_32.cmake \
            -DENABLE_DRNG=OFF -DENABLE_PQC=ON -DBUILD_TESTS=OFF -DBUILD_APP=OFF

      - name: Build
        run: cmake --build build-x86-32 --parallel 4

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --inconclusive --std=c11 \
            --suppress=missingIncludeSystem --suppress=unusedFunction \
            --suppress=missingInclude --suppress=constParameter \
            --suppress=variableScope --suppress=uninitVar \
            --error-exitcode=0 \
            src/ 2>&1 || echo "cppcheck found issues (see above)"

  full-test-suite:
    name: Full Test Suite (Automation Script)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential valgrind cppcheck

      - name: Run full test suite
        run: ./run_full_test_suite.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_reports/
